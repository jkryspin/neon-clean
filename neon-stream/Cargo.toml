[package]
name = "neon-stream"
version = "0.1.0"
edition = "2021"
description = "Neon MapleStory live data streamer"

[dependencies]
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
hex = "0.4"
neon-state = { path = "../neon-state" }
