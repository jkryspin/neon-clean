[package]
name = "neon-bot"
version.workspace = true
edition.workspace = true
description = "Neon bot engine: decisions, navigation, plans, safety"

[dependencies]
neon-core = { path = "../neon-core" }
neon-cmd = { path = "../neon-cmd" }
neon-state = { path = "../neon-state" }
neon-win = { path = "../neon-win" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2.7"
rayon = "1.10"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
