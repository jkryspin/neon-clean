[package]
name = "neon-capture"
version.workspace = true
edition.workspace = true
description = "Neon live reader: pointer chains, geometry and entity scans on Windows"

[dependencies]
neon-state = { path = "../neon-state" }
neon-win = { path = "../neon-win" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memchr = "2.7"
rayon = "1.10"
tracing = "0.1"
hex = "0.4"
