[package]
name = "neon-core"
version = "0.1.0"
edition = "2021"
description = "Neon MapleStory bot core: combat, movement, inventory, utility"

[dependencies]
# System
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Memory scanning
memchr = "2.7"
rayon = "1.10"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.40", features = ["full"] }

# WebSocket communication
tokio-tungstenite = "0.21"
futures = "0.3"

# Configuration
config = "0.14"

# Time
chrono = "0.4"

# Random for anti-detection
rand = "0.8"
rand_chacha = "0.3"
