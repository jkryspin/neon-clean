<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon View</title>
<style>
  :root { --bg:#0e1116; --panel:#171b22; --fg:#d7dde6; --dim:#8892a0; --player:#5bc0ff; --mob:#ff7b72; --drop:#e3b341; --me:#3fb950; --line:#2a303a; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6f9; --panel:#fff; --fg:#1b2330; --dim:#5b6676; --player:#0b6cb8; --mob:#c2362d; --drop:#a87000; --me:#1a7f37; --line:#d5dbe3; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  header { display:flex; gap:16px; align-items:baseline; padding:10px 16px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { font-size:16px; } .dim { color:var(--dim); }
  main { display:grid; grid-template-columns: 1fr 280px; gap:12px; padding:12px 16px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
  canvas { width:100%; height:420px; background:var(--panel); border:1px solid var(--line); border-radius:6px; }
  aside { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 12px; max-height:420px; overflow:auto; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:10px 0 4px; }
  ul { list-style:none; margin:0; padding:0; } li { padding:2px 0; display:flex; justify-content:space-between; gap:8px; }
  .k { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  section { padding:0 16px 16px; } section h2 { margin-top:0; }
  table { width:100%; border-collapse:collapse; font-size:12px; } th { text-align:left; color:var(--dim); font-weight:500; padding:3px 6px; border-bottom:1px solid var(--line); }
  td { padding:2px 6px; border-bottom:1px solid var(--line); vertical-align:top; } td.hex { font:11px ui-monospace, monospace; color:var(--dim); word-break:break-all; }
  .verified { color:var(--player); } .unregistered, .observed { color:var(--mob); } .structure, .decoded { color:var(--drop); }
  .grid2 { display:grid; grid-template-columns: 2fr 1fr; gap:12px; } @media (max-width: 800px) { .grid2 { grid-template-columns: 1fr; } }
  .box { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:8px 12px; max-height:360px; overflow:auto; }
</style>
</head>
<body>
<header>
  <b>Neon View</b>
  <span id="map" class="dim">map: -</span><label class="dim">map id <input id="mapid" size="9" placeholder="e.g. 1010" style="background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:1px 4px"></label>
  <span id="counts" class="dim"></span>
  <span id="conn" class="dim">connecting...</span>
</header>
<main>
  <canvas id="c" width="900" height="420"></canvas>
  <aside>
    <h2>Me</h2><ul id="me"></ul>
    <h2>Party</h2><ul id="party"></ul>
    <h2>Players</h2><ul id="players"></ul>
    <h2>Mobs</h2><ul id="mobs"></ul>
    <h2>Drops</h2><ul id="drops"></ul>
  </aside>
</main>
<section>
  <div class="grid2">
    <div><h2>Packets <label class="dim" style="text-transform:none;letter-spacing:0"><input type="checkbox" id="hide"> hide verified</label></h2>
      <div class="box"><table><thead><tr><th>t</th><th>opcode</th><th>name</th><th>len</th><th>fields / bytes</th></tr></thead><tbody id="pk"></tbody></table></div></div>
    <div><h2>Opcodes seen</h2>
      <div class="box"><table><thead><tr><th>opcode</th><th>n</th><th>len</th><th>status</th></tr></thead><tbody id="oc"></tbody></table></div></div>
  </div>
</section>
<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let snap = null, geo = null, geoId = null;
function loadGeo(id) {
  if (!id || id === geoId) return;
  geoId = id; geo = null;
  fetch('map/' + id).then(r => r.ok ? r.json() : null).then(g => { geo = g; draw(); });
}
document.getElementById('mapid').onchange = e => { geoId = null; loadGeo(e.target.value.trim()); };
function pts(s) {
  const out = [];
  for (const [id, p] of Object.entries(s.players)) if (p.x != null) out.push({k:'player', x:p.x, y:p.y, label:p.name || id});
  for (const [id, m] of Object.entries(s.mobs)) out.push({k:'mob', x:m.x, y:m.y, label:m.template != null ? '#' + m.template : '?'});
  for (const [id, d] of Object.entries(s.drops)) out.push({k:'drop', x:d.x, y:d.y, label:''});
  if (s.me && s.me.x != null) out.push({k:'me', x:s.me.x, y:s.me.y, label:'me'});
  return out;
}
function draw() {
  if (!snap) return;
  const r = cv.getBoundingClientRect(); cv.width = r.width * devicePixelRatio; cv.height = r.height * devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0); ctx.clearRect(0,0,r.width,r.height);
  const P = pts(snap);
  const G = geo && geo.footholds ? geo.footholds : [];
  if (!P.length && !G.length) return;
  const q = (a, f) => { const b = [...a].sort((m, n) => m - n); return b[Math.min(b.length - 1, Math.floor(f * (b.length - 1)))]; };
  // With geometry the view fits the map's platforms; without it, the 5th-95th percentile of entities (one far outlier must not squash the rest).
  const xs = G.length ? G.flatMap(f => [f.x1, f.x2]) : P.map(p => p.x), ys = G.length ? G.flatMap(f => [f.y1, f.y2]) : P.map(p => p.y);
  const lo = G.length ? 0 : .05, hi = G.length ? 1 : .95;
  const x0 = q(xs, lo) - 50, x1 = q(xs, hi) + 50, y0 = q(ys, lo) - 50, y1 = q(ys, hi) + 50;
  const sc = Math.min((r.width - 20) / Math.max(x1 - x0, 1), (r.height - 20) / Math.max(y1 - y0, 1));
  const cl = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const X = x => cl(10 + (x - x0) * sc, 6, r.width - 6), Y = y => cl(10 + (y - y0) * sc, 6, r.height - 6);   // MapleStory y grows downward, like the screen
  ctx.strokeStyle = css('--line'); ctx.lineWidth = 2;
  for (const f of G) { ctx.beginPath(); ctx.moveTo(X(f.x1), Y(f.y1)); ctx.lineTo(X(f.x2), Y(f.y2)); ctx.stroke(); }
  ctx.strokeStyle = css('--dim'); ctx.lineWidth = 1;
  for (const l of (geo && geo.ladders) || []) { if (l.x != null) { ctx.beginPath(); ctx.moveTo(X(l.x), Y(l.y1)); ctx.lineTo(X(l.x), Y(l.y2)); ctx.stroke(); } }
  ctx.font = '11px system-ui'; ctx.textBaseline = 'middle';
  for (const p of P) {
    ctx.fillStyle = css('--' + p.k); ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), p.k === 'drop' ? 3 : p.k === 'me' ? 7 : 5, 0, 7); ctx.fill();
    if (p.label) { ctx.fillStyle = css('--fg'); ctx.fillText(p.label, X(p.x) + 8, Y(p.y)); }
  }
}
function list(id, rows) { document.getElementById(id).innerHTML = rows.slice(0, 40).map(r => '<li>' + r + '</li>').join('') || '<li class="dim">none</li>'; }
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(s) {
  snap = s;
  document.getElementById('map').textContent = 'map: ' + (s.map ?? '-');
  if (s.map != null) { const box = document.getElementById('mapid'); if (document.activeElement !== box) box.value = s.map; loadGeo(String(s.map)); }
  document.getElementById('counts').textContent = s.events + ' events';
  const m = s.me, pct = (a, b) => a != null && b ? Math.round(100 * a / b) + '%' : '';
  list('me', [
    '<span>Position</span><span>' + (m.x != null ? m.x + ', ' + m.y + (m.grounded === false ? ' (air)' : '') : '?') + '</span>',
    '<span>Level</span><span>' + (m.level ?? '?') + (m.job != null ? ' (job ' + m.job + ')' : '') + '</span>',
    '<span>HP</span><span>' + (m.hp ?? '?') + (m.max_hp ? ' / ' + m.max_hp + ' ' + pct(m.hp, m.max_hp) : '') + '</span>',
    '<span>MP</span><span>' + (m.mp ?? '?') + (m.max_mp ? ' / ' + m.max_mp + ' ' + pct(m.mp, m.max_mp) : '') + '</span>',
    '<span>EXP</span><span>' + (m.exp ?? '?') + '</span>',
    '<span>EXP gained</span><span>' + s.exp_gained + ' in ' + s.exp_messages + ' kills</span>',
    '<span>Meso</span><span>' + (m.meso ?? '?') + '</span>',
    '<span>Last pickup</span><span>' + (s.pickups.length ? s.pickups[s.pickups.length - 1][0] + ' x' + s.pickups[s.pickups.length - 1][1] : '-') + '</span>']);
  list('party', s.party.map(p => '<span>' + esc(p.name) + '</span><span class="dim">Lv ' + p.level + ' ch ' + (p.channel + 1) + '</span>'));
  list('players', Object.entries(s.players).map(([id, p]) => '<span><i class="k" style="background:var(--player)"></i>' + esc(p.name || id) + '</span><span class="dim">' + (p.x ?? '?') + ', ' + (p.y ?? '?') + '</span>'));
  list('mobs', Object.entries(s.mobs).map(([id, m]) => '<span><i class="k" style="background:var(--mob)"></i>' + (m.template != null ? 'template ' + m.template : 'unknown') + '</span><span class="dim">' + m.x + ', ' + m.y + '</span>'));
  list('drops', Object.entries(s.drops).map(([id, d]) => '<span><i class="k" style="background:var(--drop)"></i>' + id + '</span><span class="dim">' + d.x + ', ' + d.y + '</span>'));
  draw();
}
const qmap = new URLSearchParams(location.search).get('map');
if (qmap) { document.getElementById('mapid').value = qmap; loadGeo(qmap); }
const hexs = t => esc(t);
function renderPackets(rows) {
  const hide = document.getElementById('hide').checked;
  document.getElementById('pk').innerHTML = rows.filter(r => !(hide && r.status === 'verified')).slice(0, 80).map(r =>
    '<tr><td class="dim">' + (r.t_ms / 1000).toFixed(1) + '</td><td class="' + r.status + '">' + r.op + '</td><td>' + esc(r.name || '') + '</td><td>' + r.len +
    '</td><td class="hex">' + (r.fields.length ? esc(r.fields.map(f => f[0] + '=' + f[1]).join(' ')) : hexs(r.hex)) + '</td></tr>').join('');
}
function renderOps(rows) {
  document.getElementById('oc').innerHTML = rows.slice(0, 60).map(r =>
    '<tr><td class="' + r.status + '">' + r.op + (r.name ? ' ' + esc(r.name) : '') + '</td><td>' + r.count + '</td><td>' + (r.min_len === r.max_len ? r.min_len : r.min_len + '-' + r.max_len) + '</td><td class="dim">' + r.status + '</td></tr>').join('');
}
let lastPk = [];
document.getElementById('hide').onchange = () => renderPackets(lastPk);
const pollInspector = () => {
  fetch('packets?limit=200').then(r => r.json()).then(j => { lastPk = j; renderPackets(j); });
  fetch('opcodes').then(r => r.json()).then(renderOps);
};
if (new URLSearchParams(location.search).has('once')) {
  pollInspector();   // single fetch: for screenshots and tests
  fetch('state').then(r => r.json()).then(s => { document.getElementById('conn').textContent = 'snapshot'; render(s); });
} else {
  pollInspector(); setInterval(pollInspector, 1500);
  const es = new EventSource('events');
  es.onmessage = e => { document.getElementById('conn').textContent = 'live'; render(JSON.parse(e.data)); };
  es.onerror = () => { document.getElementById('conn').textContent = 'disconnected'; };
}
addEventListener('resize', draw);
</script>
</body>
</html>
