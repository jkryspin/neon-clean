[package]
name = "neon-loader"
version.workspace = true
edition.workspace = true
description = "Neon launcher: patch, mock, inject, verify and open the workbench"

[dependencies]
neon-win = { path = "../../crates/neon-win" }
anyhow = "1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Memory"] }
