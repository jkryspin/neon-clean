[package]
name = "neon-loader"
version = "0.1.0"
edition = "2021"
description = "Neon MapleStory bot loader: memory scanning, input control"

[dependencies]
neon-core = { path = "../neon-core" }
neon-state = { path = "../neon-state" }

# Memory scanning
memchr = "2.7"
rayon = "1.10"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async
tokio = { version = "1.40", features = ["full"] }

# WebSocket
tokio-tungstenite = "0.21"
futures = "0.3"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
anyhow = "1.0"

# X11 for Linux/Wine
x11rb = { version = "0.13", features = ["xtest"] }

# Random for anti-detect
rand = "0.8"
