[package]
name = "neon-inject"
version = "0.1.0"
edition = "2021"
description = "Neon MapleStory memory injector (Linux/Wine)"

[lib]
name = "neon_inject"
crate-type = ["cdylib"]

[[bin]]
name = "inject"
path = "src/bin/inject.rs"

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "z"
lto = true
