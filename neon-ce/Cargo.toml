[package]
name = "neon-ce"
version = "0.1.0"
edition = "2021"
description = "Neon cheat engine: typed memory scanning, freezes and cheat tables for MapleStory Classic World"

[[bin]]
name = "neon-ce"
path = "src/main.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }

[profile.release]
opt-level = 3
lto = "thin"
