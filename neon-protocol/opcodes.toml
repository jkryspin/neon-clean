[[opcode]]
id = 0x00ae
dir = "in"
name = "Chat"
status = "verified"
summary = "A text message shown in the chat window: kind byte @2 (3 and 8 most common, 1884/1536 of 3698; 32 and 2 rarer), u16 text length @3, then the text (e.g. `Name : S> 10 Int Earrings 1.6m`, a trade shout). The length equals the remaining text in 179 of 179 packets. kind 2 (32 seen) has a trailer after the text that matches 0x022f Whisper\u0027s schema exactly: the sender name and the message AGAIN as two more length-prefixed strings, then a 4-byte varying value, a constant u32 = 0x00000ee0, a constant byte 0x50, then a u32 in the player-id range - so kind 2 looks like a shout from a buddy/party-adjacent channel that carries the same click-to-reply data as a whisper. kind 32 (290 seen in a bigger pool, 2026-10-26) is NOT a chat message at all despite riding this opcode: the text field is always a well-formed player name (290/290 alphanumeric), and 9 bytes after a constant u32 = 0x004faed4 (290/290) sits a u32 that only takes 7 distinct values across all 290 packets for many different names, every one of them in the classic equip-id range (1007144, 1017024, 1057092, 1057098, 1077060, 1087021, 1702048 - cap/face/top/top/shoes/glove/cash-weapon-shaped ids by the usual 100-170 prefix convention), roughly evenly spread (28-60 hits each). So it looks like some kind of per-player announcement carrying one representative equipped item, not free text; it is a different trailer shape from 0x023d ShopSign (which keys off char_id, not name) so it is not simply that event riding this opcode. Exact meaning (an icon for a shop/trade popup? an equip-change toast?) is not established. kind 0 (rare) unexplained. (2026-10-26)"
len_min = 6
field = [
  { name = "kind", ty = "u8", off = 2 },
  { name = "text", ty = "str16", off = 3, min = 1, max = 500, charset = "printable" },
]

