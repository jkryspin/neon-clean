# ---- outgoing (client -> server): plaintext read from the client's packet object (docs/network-protocol.md) -----------------
[[opcode]]
id = 0x00db
dir = "out"
name = "MoveSelf"
status = "structure"
summary = "Our own movement, sent about every 0.5 s while moving. Aligned with real key presses (2026-10-26, jib01 in Amherst): x@16 / y@18 follow the walk (rising while walking right, falling walking left) and y dips to 243 and 196 during a jump; the final x,y (598, 274) equals what the independent memory reader reported a moment later. tick u32@7 is a millisecond clock (+510 to +514 between packets 0.5 s apart). count@24 is the number of movement fragments; the length fits 26 + 21n + 10 for n = 1 (57 bytes), 2 (78), 3 (99), 4 (120) but not always when a jump is included (108, 150 bytes): fragment kinds of other sizes exist. The server relays this as 0x029d to the other players. On the wire it has a per-connection opcode (jib01 2026-10-26: 0x5f28; 6/6 jump key presses produce one; same layout: 01 6a 4d e8 f1 prefix, tick u32@7, x/y fragments). Climbing a ladder uses this SAME opcode and the SAME x@16/y@18 header fields, not a separate one: captured a live climb up and back down a real ladder (Amherst, map 1010, ladder x=991) and every packet during the climb has x@16 held constant at 991 (0x03df) while y@18 moves through the ladder range (down to -116 near the top), exactly matching the ladder's recorded x/y1/y2 in neon-calib/maps/1010.json. SOLVED with the real data: each 21-byte fragment is [cmd u8, ?, x i16, y i16, vx i16, vy i16, foothold i16, 6 unexplained bytes, stance u8, duration u16] (same relative layout as 0x029d PlayerMove's record table; found and fixed an off-by-one in this opcode's own un-verified records.start, which said 26 instead of the correct 25). Over 152 real fragments from this capture: every fragment with foothold == -1 (the \"no platform underneath\" sentinel) has stance == 15, and stance 15 NEVER appears on any of the 141 fragments with a real foothold id - a clean, total separation. So stance 15 is the ladder-climbing stance; stance 2-6 are ground-walking variants (by foothold id), and stance 7 is jump/airborne: triggered one ISOLATED vertical jump (Alt alone, no direction key, from a dead stop on solid ground) and its 3-fragment packet decoded perfectly cleanly end to end (no overrun) - fragment 0 has foothold 0 (the airborne sentinel, distinct from ladder's -1) with a real vy and stance 7, fragment 1 is still foothold 0/stance 7 at vy back to 0 (the jump's apex), fragment 2 lands back on the real foothold (56) with stance 5, matching ordinary ground-idle. This DISPROVES an earlier same-night guess that a jump fragment uses a bigger-than-21-byte size: a real, isolated jump fits the exact same 21-byte stride with no decode trouble at all. 254/255 (seen in an unrelated bigger multi-fragment packet, at x=862, the documented invisible-wall spot) are still not explained by a jump-size issue, then - that packet's specific desync cause is back to open, but it is NOT simply \"jumps are bigger\". Looked closer at that packet anyway: its first 3 fragments decode cleanly (stance 4, 2, then 6 - this last one already at foothold 0, the airborne sentinel, with vy still 0, which reads as the very first liftoff instant of a DIRECTIONAL jump, since it came right after a held Right+Alt combo, unlike the pure-vertical isolated jump above) and fragment 4 onward is where it breaks. Two other real stance-6/foothold-0 fragments elsewhere in the pool have genuine nonzero vx/vy (e.g. vx=8, vy=-15 and vx=8, vy=225), so stance 6 plausibly means \"airborne while moving horizontally\" (a diagonal jump), as opposed to stance 7's vertical-only jump - both share the same foothold=0 sentinel. Still unexplained: why THIS packet's parse breaks exactly one fragment after that liftoff fragment, when the isolated pure-vertical jump above did not break at all. (2026-10-26)"
len_min = 57
field = [
  { name = "tick", ty = "u32", off = 7 },
  { name = "x", ty = "i16", off = 16, min = -20000, max = 20000 },
  { name = "y", ty = "i16", off = 18, min = -20000, max = 20000 },
  { name = "count", ty = "u8", off = 24 },
]

