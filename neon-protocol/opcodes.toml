# Opcode registry for MapleStory Classic World (client v1.0.1).
# status:
#   verified  - field layout below was tested against real captured packets (neon-protocol/tests)
#   decoded   - decoded in neon-stream/src/net.rs but the layout is not expressed here yet
#   structure - sizes/shape known from payloads, meaning not known
#   observed  - seen on the wire only
# Never guess names: add a name only with evidence from an isolated action or a fixture. Offsets are into the
# decoded plaintext, which starts with the 2-byte little-endian opcode. Types: u8 u16 u32 i16 i32 str16 (u16 length, then bytes at off+2).

[[opcode]]
id = 0x03c9
dir = "in"
name = "MobSpawn"
status = "verified"
summary = "A mob appears (also sent for mobs already on the map when we enter it)"
len_min = 313
len_max = 313
field = [
  { name = "oid", ty = "u32", off = 3 },
  { name = "template", ty = "u32", off = 8 },
  { name = "x", ty = "i16", off = 206 },
  { name = "y", ty = "i16", off = 208 },
]

[[opcode]]
id = 0x03dc
dir = "in"
name = "MobMove"
status = "verified"
summary = "Mob movement; x,y is where the move starts (later fragments are not decoded)"
len_min = 83
field = [
  { name = "oid", ty = "u32", off = 2 },
  { name = "x", ty = "i16", off = 30 },
  { name = "y", ty = "i16", off = 32 },
]

[[opcode]]
id = 0x03d4
dir = "in"
name = "MobKill"
status = "verified"
summary = "A mob was removed (killed)"
len_min = 16
len_max = 16
field = [{ name = "oid", ty = "u32", off = 2 }]

[[opcode]]
id = 0x044d
dir = "in"
name = "MobDamaged"
status = "structure"
summary = "Mob damaged: oid u32@2, attacker char id u32@6, damage u32@10 (layout from docs, not yet tested; unused)"
len_min = 14
len_max = 14

[[opcode]]
id = 0x022d
dir = "in"
name = "PlayerSpawn"
status = "verified"
summary = "Another player (or us) appears on the map"
len_min = 24
field = [
  { name = "char_id", ty = "u32", off = 6 },
  { name = "name", ty = "str16", off = 18 },
]

[[opcode]]
id = 0x029d
dir = "in"
name = "PlayerMove"
status = "verified"
summary = "Another player moved"
len_min = 14
field = [
  { name = "char_id", ty = "u32", off = 2 },
  { name = "x", ty = "i16", off = 10 },
  { name = "y", ty = "i16", off = 12 },
]

[[opcode]]
id = 0x0471
dir = "in"
name = "DropSpawn"
status = "verified"
summary = "A drop of ours appeared (sent twice: flag byte 1 then 0; dedupe by oid). Only our own kills' drops are sent to us"
len_min = 40
field = [
  { name = "oid", ty = "u32", off = 4 },
  { name = "owner", ty = "u32", off = 25 },
  { name = "x", ty = "i16", off = 30 },
  { name = "y", ty = "i16", off = 32 },
]

[[opcode]]
id = 0x0472
dir = "in"
name = "DropRemove"
status = "verified"
summary = "A drop is gone: reason u8@6 (2 picked up, 5 pet loot, 0 expired), picker char id u32@7"
len_min = 11
len_max = 11
field = [{ name = "oid", ty = "u32", off = 2 }]

[[opcode]]
id = 0x007e
dir = "in"
name = "StatUpdate"
status = "verified"
summary = "Own stat update: a bitmask of stats, values follow in ascending bit order (sizes in neon-stream/src/net.rs; some unverified). A 12-byte variant with an empty mask (7e 00 00 00 01 00 00 00 00 01 <u16>) is sent with every party create/leave (actlab, 3 of 3 repeats, 2026-10-26); its trailing u16 was 0x0808-ish on create and 0x000f on leave, meaning unknown"
len_min = 11
field = [{ name = "mask", ty = "u32", off = 5 }]

[[opcode]]
id = 0x008b
dir = "in"
name = "StatusMessage"
status = "decoded"
summary = "Pickup message (type 0: item or mesos), quest progress (type 1); decoded in neon-stream"

[[opcode]]
id = 0x0072
dir = "in"
name = "InventoryChange"
status = "decoded"
summary = "One inventory slot changed; decoded in neon-stream"

[[opcode]]
id = 0x01a9
dir = "in"
name = "InventoryAll"
status = "decoded"
summary = "The whole Use/Set-up/Etc inventory at login; decoded in neon-stream"

[[opcode]]
id = 0x00a7
dir = "in"
name = "PartyUpdate"
status = "decoded"
summary = "Party create (mode 0x0e), member joined (0x13), member left (0x10); decoded in neon-stream"

[[opcode]]
