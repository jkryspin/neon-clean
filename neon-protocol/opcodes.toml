summary = "We report the movement of a mob we control (see incoming 0x03d5 MobControl): the mob oid u32@2 is a mob seen in the incoming stream in 5 of 5 packets (and each is a mob whose 0x03d5 carried our id), followed by a u16 move counter @6 that counts 1, 2, 3 per mob. Lengths 160 and 169. The server relays this to others as the incoming 0x03dc MobMove. It filled the bot's runs (340 of ~500 outgoing packets) because every mob near the bot is controlled by it. Remaining fields unexplained (2026-10-26)"
len_min = 100
field = [
  { name = "mob_oid", ty = "u32", off = 2 },
  { name = "move_id", ty = "u16", off = 6 },
]

[[opcode]]
id = 0x00c5
dir = "out"
name = "SeqReply"
status = "structure"
summary = "4 bytes: c5 00 NN 01. The client's answer to every incoming 0x004f burst packet, same counter byte NN, 12-13 ms later (144/144 on jib01, 143/144 on shurella2). Unlike most client->server packets, the number 0x00c5 on the wire is the same on both accounts (it equals the number here, so this entry's id is the wire number; the internal number was not seen). One burst of six per 60 s (2026-10-26)"
len_min = 4
len_max = 4

[[opcode]]
id = 0x009c
dir = "out"
status = "structure"
summary = "149 bytes every 10.0 s (97% of 141 gaps within 15%), the same number on both accounts (wire number; internal not seen). Starts 9c 00 64 00 00 00 15 cd 5b 07, a repeated block of mostly zeros with a few small signed values (-32, -4, -8 seen) and the 4-byte value 15 cd 5b 07 twice; a periodic state report of the client. The same packet is sent in the login phase. Meaning unknown (2026-10-26)"
len_min = 149
len_max = 149

[[opcode]]
id = 0x032b
dir = "out"
name = "PickupDrop"
status = "structure"
summary = "We ask to pick up a drop (the bot's loot key): 36 bytes, tick u32@3 (same ms clock as MoveSelf), our position x i16@11 / y i16@13, the drop's oid u32@15. In 6 of 6 packets the oid is a drop that had spawned, and each was answered 0.6 to 1.2 s later by the incoming 0x0472 DropRemove with reason 2 (picked up) and picker = our own id 334426 (2026-10-26, shurelia2 grinding). Other bytes unexplained"
len_min = 36
len_max = 36
field = [
  { name = "tick", ty = "u32", off = 3 },
  { name = "x", ty = "i16", off = 11, min = -20000, max = 20000 },
  { name = "y", ty = "i16", off = 13, min = -20000, max = 20000 },
  { name = "drop_oid", ty = "u32", off = 15, min = 1 },
]

[[opcode]]
id = 0x02f0
dir = "out"
name = "KeepAlive"
status = "structure"
summary = "2 bytes, no fields, every 10.0 s (two intervals of exactly 10.0 s in the bot capture; also seen idle). Not a reply to the incoming 0x001b, which also repeats every 10 s but in another phase (3 to 7 s away). On the wire it is a different, per-connection opcode (jib01 2026-10-26: 0x8786, shurella2: 0xf5e8): it is the answer to the incoming 2-byte ping 0x062e (139 pings, 139 keepalives, each 2-70 ms later)"
len_min = 2
len_max = 2

