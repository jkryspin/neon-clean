# Opcode registry for MapleStory Classic World (client v1.0.1).
# status:
#   verified  - field layout below was tested against real captured packets (neon-protocol/tests)
#   decoded   - decoded in neon-stream/src/net.rs but the layout is not expressed here yet
#   structure - sizes/shape known from payloads, meaning not known
#   observed  - seen on the wire only
# Never guess names: add a name only with evidence from an isolated action or a fixture. Offsets are into the
# decoded plaintext, which starts with the 2-byte little-endian opcode. Types: u8 u16 u32 i16 i32 str16 (u16 length, then bytes at off+2).

[[opcode]]
id = 0x03c9
dir = "in"
name = "MobSpawn"
status = "verified"
summary = "A mob appears (HP u32@225: equals the mob's HP from the public database for its template in 100% of 540 packets: Snail 45, Blue Snail 51, Red Snail 68, Stump 133, Dark Stump 236; all real spawns are 313 bytes) (also sent for mobs already on the map when we enter it)"
len_min = 313
field = [
  { name = "oid", ty = "u32", off = 3 },
  { name = "template", ty = "u32", off = 8, min = 1, max = 1000000 },
  { name = "x", ty = "i16", off = 206, min = -20000, max = 20000 },
  { name = "y", ty = "i16", off = 208, min = -20000, max = 20000 },
  { name = "hp", ty = "u32", off = 225, min = 1, max = 100000000 },
]

