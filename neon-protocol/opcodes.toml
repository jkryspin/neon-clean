[[opcode]]
id = 0x0456
dir = "in"
status = "structure"
summary = "(NPC movement is described by the entry above; this is the remaining 12-byte form) Busiest opcode in a town (1295 packets, 4 min): sizes 12, or 26+21n (n=1..5; 47 is most common). u32@2 is NOT a counter: only 3 values seen (138,139,140), a group/type tag. The 21-byte records start with a flag byte (0) then a u32 id; ids within a packet run in sequence (0x009a0710, 0x009a0718, 0x009a071c) and each record has small signed values (e.g. -15, -87) and a 0x50 or 0x24 constant. Not player or mob ids. Meaning unknown (2026-10-26, jib01 in Amherst) FACTS (exact-decoded logs, 2026-10-26): 39602 packets in 16 log(s); sizes 47 x27079, 12 x3574, 89 x2468, 56 x2121; median gap 0.5 s; constant bytes @3-6=00 00 00 ff, @8-15=00 00 00 00 00 00..., @20-26=00 00 00 00 01 00..., @31-34=00 00 00 00, @36-42=00 00 00 00 00 00.... Meaning not established."

